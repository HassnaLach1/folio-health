name: folio-health

services:
  worker:
    profiles: [worker]
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env.worker.local
    restart: unless-stopped
    volumes:
      - folio_ocr_cache:/app/.cache/ocr-language

  web:
    build:
      context: .
      args:
        EXPO_PUBLIC_SUPABASE_URL: ${EXPO_PUBLIC_SUPABASE_URL:-}
        EXPO_PUBLIC_SUPABASE_ANON_KEY: ${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}
        EXPO_PUBLIC_REQUIRE_MFA: ${EXPO_PUBLIC_REQUIRE_MFA:-true}
        EXPO_PUBLIC_DOCTOR_VIEW_URL: ${EXPO_PUBLIC_DOCTOR_VIEW_URL:-}
    ports:
      - "8081:80"

volumes:
  folio_ocr_cache:
    external: true
