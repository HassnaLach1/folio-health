AWSTemplateFormatVersion: '2010-09-09'
Description: Folio Health Docker host in Ireland; no local records are imported.
Parameters:
  CreateRepositories:
    Type: String
    AllowedValues: ['true','false']
    Default: 'true'
    Description: Set false to reuse repositories retained by an earlier failed launch.
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet in the selected VPC with an Internet Gateway route.
Conditions:
  NewRepositories: !Equals [!Ref CreateRepositories, 'true']
Resources:
  WebRepository:
    Condition: NewRepositories
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    Properties:
      RepositoryName: folio-health-web
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
      EncryptionConfiguration: {EncryptionType: AES256}
  WorkerRepository:
    Condition: NewRepositories
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    Properties:
      RepositoryName: folio-health-worker
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
      EncryptionConfiguration: {EncryptionType: AES256}
  HostRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: PullFolioImagesAndInvokeHaiku
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability,ecr:GetDownloadUrlForLayer,ecr:BatchGetImage]
                Resource:
                  - !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/folio-health-web
                  - !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/folio-health-worker
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub arn:aws:bedrock:eu-west-1:${AWS::AccountId}:inference-profile/eu.anthropic.claude-haiku-4-5-20251001-v1:0
                  - arn:aws:bedrock:eu-west-1::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                  - arn:aws:bedrock:eu-central-1::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                  - arn:aws:bedrock:eu-west-3::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                  - arn:aws:bedrock:eu-north-1::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                  - arn:aws:bedrock:eu-south-1::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                  - arn:aws:bedrock:eu-south-2::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
  HostProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref HostRole]
  Firewall:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Folio HTTPS and certificate validation; administration uses SSM.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp,FromPort: 80,ToPort: 80,CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp,FromPort: 443,ToPort: 443,CidrIp: 0.0.0.0/0}
  Host:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: t3.small
      IamInstanceProfile: !Ref HostProfile
      CreditSpecification: {CPUCredits: standard}
      MetadataOptions: {HttpTokens: required,HttpPutResponseHopLimit: 2,HttpEndpoint: enabled}
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref Firewall]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 40,VolumeType: gp3,Encrypted: true,DeleteOnTermination: false}
      Tags:
        - {Key: Name,Value: folio-health}
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker git
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins /opt/folio
          cd /tmp
          curl -fsSLO https://github.com/docker/compose/releases/download/v2.39.4/docker-compose-linux-x86_64
          curl -fsSLO https://github.com/docker/compose/releases/download/v2.39.4/docker-compose-linux-x86_64.sha256
          sha256sum -c docker-compose-linux-x86_64.sha256
          install -m 755 docker-compose-linux-x86_64 /usr/local/lib/docker/cli-plugins/docker-compose
          # Keep installation private until configured and verified.
          chmod 700 /opt/folio
          # Encrypted EBS also holds a small swap area for bounded extraction peaks.
          fallocate -l 2G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          printf '/swapfile swap swap defaults 0 0\n' >> /etc/fstab
          sysctl -w vm.swappiness=10
  Address:
    Type: AWS::EC2::EIP
    Properties: {Domain: vpc}
  AddressAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt Address.AllocationId
      InstanceId: !Ref Host
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: folio-monthly-50-usd
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: 50,Unit: USD}
Outputs:
  InstanceId: {Value: !Ref Host}
  PublicIp: {Value: !Ref Address}
  TemporaryHost: {Value: !Sub 'folio-${Address}.sslip.io'}
  WebImageRepository: {Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/folio-health-web'}
  WorkerImageRepository: {Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/folio-health-worker'}
