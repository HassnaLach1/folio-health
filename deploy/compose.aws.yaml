# Layer over supabase/docker-compose.yml. Paths are relative to that first file.
name: folio-cloud
services:
  api-gw:
    container_name: ${COMPOSE_PROJECT_NAME:-folio-cloud}-gateway
    ports: !reset []
    expose: [8000]
  db:
    container_name: ${COMPOSE_PROJECT_NAME:-folio-cloud}-db
    volumes: !override
      - ./volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
      - ./volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:ro
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - ./volumes/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:ro
      - ./volumes/db/logs.sql:/docker-entrypoint-initdb.d/migrations/99-logs.sql:ro
      - ./volumes/db/pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql:ro
      - database:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
  auth:
    container_name: ${COMPOSE_PROJECT_NAME:-folio-cloud}-auth
    environment:
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-true}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL}/callback
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: "12"
      GOTRUE_LOG_LEVEL: warn
  rest:
    container_name: ${COMPOSE_PROJECT_NAME:-folio-cloud}-rest
  storage:
    container_name: ${COMPOSE_PROJECT_NAME:-folio-cloud}-storage
    volumes: !override
      - originals:/var/lib/storage
  imgproxy:
    container_name: ${COMPOSE_PROJECT_NAME:-folio-cloud}-imgproxy
    volumes: !override
      - originals:/var/lib/storage:ro
  studio:
    container_name: ${COMPOSE_PROJECT_NAME:-folio-cloud}-studio
    ports: ["127.0.0.1:54323:3000"]
  meta:
    container_name: ${COMPOSE_PROJECT_NAME:-folio-cloud}-meta
  # Folio polls its queue and does not need these services for this deployment.
  realtime:
    profiles: [extras]
  functions:
    profiles: [extras]
  supavisor:
    profiles: [extras]
    ports: !reset []
  migrate:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      auth: {condition: service_healthy}
      storage: {condition: service_healthy}
    environment:
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set a fresh database password}
    volumes:
      - ../../supabase/migrations:/migrations:ro
      - ../migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]
  worker:
    image: ${WORKER_IMAGE:-folio-health-worker:cloud}
    build: {context: ../.., dockerfile: worker/Dockerfile}
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      api-gw: {condition: service_healthy}
    environment:
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?Generate a fresh service key}
      EXTRACTION_ENGINE: ${EXTRACTION_ENGINE:-bedrock}
      EXTRACTION_FALLBACK: local
      AWS_REGION: eu-west-1
      AWS_BEDROCK_MODEL_ID: eu.anthropic.claude-haiku-4-5-20251001-v1:0
      AWS_EC2_METADATA_V1_DISABLED: "true"
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - ocr-models:/app/.cache/ocr-language
    mem_limit: 1200m
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  web:
    image: ${WEB_IMAGE:-folio-health-web:cloud}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL:?Set the HTTPS API URL}
        EXPO_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY:?Generate a fresh public key}
        EXPO_PUBLIC_REQUIRE_MFA: "true"
        EXPO_PUBLIC_DOCTOR_VIEW_URL: ${SITE_URL:?Set the HTTPS app URL}
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      APP_HOST: ${APP_HOST:?Set the app hostname}
      SITE_URL: ${SITE_URL:?Set the HTTPS app URL}
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy-config:/config
    depends_on:
      web: {condition: service_healthy}
      api-gw: {condition: service_healthy}
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
volumes:
  database:
  originals:
  ocr-models:
  certificates:
  proxy-config:
