# Small Free Plan host: only services Folio uses continuously.
# Studio can be started temporarily with --profile admin.
services:
  api-gw:
    depends_on: !override
      auth: {condition: service_healthy}
      rest: {condition: service_healthy}
      storage: {condition: service_healthy}
    mem_limit: 160m
  studio:
    profiles: [admin]
    mem_limit: 350m
  meta:
    profiles: [admin]
    mem_limit: 200m
  imgproxy:
    profiles: [extras]
  db:
    mem_limit: 600m
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf, -c, shared_buffers=128MB, -c, work_mem=4MB, -c, max_connections=60, -c, log_min_messages=fatal]
  auth:
    mem_limit: 160m
    environment:
      GOTRUE_DB_MAX_POOL_SIZE: "5"
  rest:
    mem_limit: 120m
    environment:
      PGRST_DB_POOL: "5"
  storage:
    mem_limit: 300m
    depends_on: !override
      db: {condition: service_healthy}
      rest: {condition: service_healthy}
    environment:
      ENABLE_IMAGE_TRANSFORMATION: "false"
      NODE_OPTIONS: --max-old-space-size=192
  worker:
    mem_limit: 900m
    memswap_limit: 1800m
    environment:
      NODE_OPTIONS: --max-old-space-size=256
  web:
    mem_limit: 64m
  proxy:
    mem_limit: 128m
